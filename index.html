function normPhone(s){ return String(s||'').replace(/\D/g,''); }
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function uid(p){ return (p||'id')+'_'+Math.random().toString(36).slice(2,9); }
var AVATAR_COLORS = ['#1F3A5F','#B4802E','#5B6FAE','#7A5C8C','#1F7A52'];
function avatarColor(seed){
  var s = String(seed||''); var h = 0;
  for (var i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) >>> 0;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
}
function initials(name){
  var parts = String(name||'').trim().split(/\s+/);
  if (!parts.length || !parts[0]) return '?';
  var last = parts[parts.length-1];
  return (last[0]||'?').toUpperCase();
}

function canEditClass(lop){
  if (state.isSuper) return true;
  if (!lop) return false;
  if ((state.myClasses || []).indexOf(lop) !== -1) return true;
  // Lớp hoàn toàn mới (chưa ai dùng) — admin được tự thêm, lớp sẽ thuộc quyền quản lý của họ.
  return getClassList().indexOf(lop) === -1;
}

function isNewClaimableClass(lop){
  return !state.isSuper && !!lop && (state.myClasses||[]).indexOf(lop) === -1 && getClassList().indexOf(lop) === -1;
}

function claimClass(lop){
  if (state.isSuper || !lop) return Promise.resolve();
  if ((state.myClasses||[]).indexOf(lop) !== -1) return Promise.resolve();
  var user = firebase.auth().currentUser;
  if (!user) return Promise.resolve();
  var ref = firebase.firestore().collection('classOwners').doc(lop);
  return ref.get().then(function(doc){
    if (doc.exists) {
      if (doc.data().ownerUid === user.uid) {
        if (state.myClasses.indexOf(lop) === -1) state.myClasses.push(lop);
        return true;
      }
      return false; // đã bị admin khác chiếm trước
    }
    return ref.set({ ownerUid: user.uid, email: user.email, createdAt: new Date().toISOString() })
      .then(function(){
        state.myClasses.push(lop);
        return true;
      }).catch(function(){ return false; });
  }).catch(function(){ return false; });
}

var ROUND_COLS_PER_SUBJECT = 4;

function roundColHeaders(n){
  return ['Đợt ' + n, 'Điểm ' + n];
}

function buildSubjectSheetRows(students){
  var header = ['Họ tên', 'SĐT', 'Lớp'];
  for (var i = 1; i <= ROUND_COLS_PER_SUBJECT; i++) header = header.concat(roundColHeaders(i));
  header.push('Nhận xét');
  var rows = [header];
  students.forEach(function(stu){
    var row = [stu.hoTen, stu.sdt, stu.lop];
    for (var i = 0; i < ROUND_COLS_PER_SUBJECT; i++) {
      var rd = stu.rounds[i] || [];
      row.push(rd[0] || '', rd[1] || '');
    }
    row.push(stu.nhanXet || '');
    rows.push(row);
  });
  return rows;
}

  var toanRows = buildSubjectSheetRows([

    ]},
    { hoTen:'Trần Gia Bảo', sdt:'0987654321', lop:'10A2', nhanXet:'Cần cố gắng hơn', rounds: [
      ['Kiểm tra 15 phút lần 1','4.5']
    ]}
  ]);
  var wsToan = XLSX.utils.aoa_to_sheet(toanRows);
  wsToan['!cols'] = colsLayout;
  XLSX.utils.book_append_sheet(wb, wsToan, 'Toán');

  var vanRows = buildSubjectSheetRows([
    { hoTen:'Nguyễn Minh Anh', sdt:'0912345678', lop:'10A1', nhanXet:'', rounds: [
      ['Kiểm tra miệng','7']
    ]},
    { hoTen:'Trần Gia Bảo', sdt:'0987654321', lop:'10A2', nhanXet:'', rounds: [] }
  ]);
  var wsVan = XLSX.utils.aoa_to_sheet(vanRows);
  wsVan['!cols'] = colsLayout;
  XLSX.utils.book_append_sheet(wb, wsVan, 'Ngữ văn');

  return XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
}

function scoreClass(v){
  var n = Number(v);
  if (isNaN(n)) return 'score-mid';
  if (n >= 8) return 'score-good';
  if (n < 5) return 'score-warn';
  return 'score-mid';
}

function subjectAvg(subj){
  var vals = (subj.doTKiemTra||[]).map(function(r){ return Number(r.diem); }).filter(function(n){ return !isNaN(n); });
  if (!vals.length) return null;
  var sum = vals.reduce(function(a,b){ return a+b; },0);
  return Math.round((sum/vals.length)*10)/10;
}

function render(){
  var html = '';
  html += '<div class="top">';
  html += '  <div></div>';

    html += '  <button class="btn" data-act="toggle-admin">' +
      (state.showAdmin ? 'Đóng quản trị' : 'Quản trị') + '</button>';
    html += '  <button class="btn btn-ghost" data-act="logout">Đăng xuất</button>';
  } else {
    html += '  <button class="btn btn-ghost" data-act="show-login">Đăng nhập quản trị</button>';
  }

    html += renderSearch();
    html += renderTeachers();
  } else {
    html += '<div class="wrap">' + renderAdmin() + '</div>';
  }

  var footSettings = getSettings();
  html += '<footer>' + (footSettings.footerText ? esc(footSettings.footerText) + ' · ' : '') +
    'Dữ liệu điểm được cập nhật gần nhất: ' + esc(state.data.updatedAt || '—') + '</footer>';

  root.innerHTML = html;

function renderLoginModal(){
  var h = '<div class="overlay" data-act="close-login-bg"><div class="modal" data-stop="1" style="max-width:380px;">';
  h += '<h2>Đăng nhập quản trị</h2>';
  h += '<div class="field"><label>Email</label><input id="login-email" type="email" autocomplete="username"></div>';
  h += '<div class="field"><label>Mật khẩu</label><input id="login-pass" type="password" autocomplete="current-password"></div>';
  if (state.loginError) h += '<p class="error-text">' + esc(state.loginError) + '</p>';
  h += '<div class="toolbar" style="margin-top:8px;">';
  h += '<button class="btn btn-primary" data-act="do-login">Đăng nhập</button>';
  h += '<button class="btn btn-ghost" data-act="close-login">Hủy</button>';
  h += '</div></div></div>';
  var div = document.createElement('div');
  div.innerHTML = h;
  root.appendChild(div.firstChild);
  var overlay = root.querySelectorAll('.overlay')[root.querySelectorAll('.overlay').length - 1];
  overlay.addEventListener('click', function(ev){
    if (ev.target.closest('[data-stop]')) return;
    state.showLogin = false; state.loginError = null; render();
  });
  overlay.querySelector('[data-act="close-login"]').addEventListener('click', function(){
    state.showLogin = false; state.loginError = null; render();
  });
  function submit(){
    var email = overlay.querySelector('#login-email').value.trim();
    var pass = overlay.querySelector('#login-pass').value;
    if (!email || !pass) { state.loginError = 'Vui lòng nhập đủ email và mật khẩu.'; render(); return; }
    state.loginError = 'Đang đăng nhập…';
    render();
    firebase.auth().signInWithEmailAndPassword(email, pass).then(function(){
      state.showLogin = false; state.loginError = null;
      render();
    }).catch(function(e){
      state.loginError = (e && e.code === 'auth/invalid-credential') ? 'Sai email hoặc mật khẩu.' : ('Không đăng nhập được: ' + (e && e.message ? e.message : ''));
      render();
    });
  }
  overlay.querySelector('[data-act="do-login"]').addEventListener('click', submit);
  overlay.querySelector('#login-pass').addEventListener('keydown', function(ev){ if (ev.key === 'Enter') submit(); });
}

function getClassList(){
  var set = {};
  (state.data.classes||[]).forEach(function(c){ if (c) set[c] = true; });
  state.data.students.forEach(function(s){ if (s.lop) set[s.lop] = true; });
  return Object.keys(set).sort(function(a,b){ return a.localeCompare(b, 'vi'); });
}

function adminVisibleClasses(){
  var all = getClassList();
  if (state.isSuper) return all;
  return all.filter(function(c){ return (state.myClasses||[]).indexOf(c) !== -1; });
}

function scopedStudents(){
  if (state.isSuper) return state.data.students;
  var mine = state.myClasses || [];
  return state.data.students.filter(function(s){ return mine.indexOf(s.lop) !== -1; });
}

function requestDelete(type, id, label){
  state.pendingDelete = { type: type, id: id, label: label };
  render();
}

function renderConfirmDelete(){
  var pd = state.pendingDelete;
  var h = '<div class="overlay" data-act="cancel-delete-bg"><div class="modal" data-stop="1" style="max-width:420px;">';
  h += '<h2>Xác nhận xóa</h2>';
  var extraNote = '';
  if (pd.type === 'class') {
    var affectedCount = state.data.students.filter(function(s){ return s.lop === pd.id; }).length;
    extraNote = affectedCount ? (' Toàn bộ ' + affectedCount + ' học sinh thuộc lớp này sẽ bị XÓA theo, không thể khôi phục.') : '';
  }
  h += '<p class="hint" style="margin-top:0;">Bạn có chắc muốn xóa "' + esc(pd.label) + '"?' + extraNote + ' Nhấn "Lưu thay đổi" sau đó để áp dụng.</p>';
  h += '<div class="toolbar" style="margin-top:16px;">';
  h += '<button class="btn btn-danger" data-act="confirm-delete">Xóa</button>';
  h += '<button class="btn btn-ghost" data-act="cancel-delete">Hủy</button>';
  h += '</div></div></div>';
  var div = document.createElement('div');
  div.innerHTML = h;
  root.appendChild(div.firstChild);
  var overlay = root.querySelectorAll('.overlay')[root.querySelectorAll('.overlay').length - 1];
  overlay.addEventListener('click', function(ev){
    if (ev.target.closest('[data-stop]')) return;
    state.pendingDelete = null; render();
  });
  overlay.querySelector('[data-act="cancel-delete"]').addEventListener('click', function(){
    state.pendingDelete = null; render();
  });
  overlay.querySelector('[data-act="confirm-delete"]').addEventListener('click', function(){
    if (pd.type === 'student') {
      state._deletedStudentIds.push(pd.id);
      state.data.students = state.data.students.filter(function(x){ return x.id !== pd.id; });
      delete state.data._isSample;
    } else if (pd.type === 'teacher') {
      state._deletedTeacherIds.push(pd.id);
      state.data.teachers = (state.data.teachers||[]).filter(function(x){ return x.id !== pd.id; });
    } else if (pd.type === 'class') {
      state.data.classes = (state.data.classes||[]).filter(function(x){ return x !== pd.id; });
      state.data.students.filter(function(s){ return s.lop === pd.id; }).forEach(function(s){ state._deletedStudentIds.push(s.id); });
      state.data.students = state.data.students.filter(function(s){ return s.lop !== pd.id; });
      if (state.adminClassFilter === pd.id) state.adminClassFilter = null;
      delete state.data._isSample;
    }
    state.pendingDelete = null;
    render();
  });
}

function renderStudentResult(s){
  var h = '<div class="card">';
  h += '<div class="result-head"><h2>' + esc(s.hoTen) + '</h2>';
  h += '<span class="meta">Lớp: ' + esc(s.lop||'—') + ' · SĐT/Mã học sinh: ' + esc(s.sdt) + '</span></div>';

  if (!subs.length) {
    h += '<p class="hint">Chưa có điểm kiểm tra nào được ghi nhận.</p>';
  } else {
    subs.forEach(function(subj, idx){
      var avg = subjectAvg(subj);
      h += '<details class="subject-acc"' + (idx===0 ? ' open' : '') + '><summary>';
      h += '<span class="subj-meta"><span class="chev">▸</span><span class="subj-name">' + esc(subj.ten) + '</span></span>';
      h += '<span class="subj-meta">' + (avg!=null ? '<span class="score-pill ' + scoreClass(avg) + '">TB ' + avg + '</span>' : '') +
        '<span class="badge">' + (subj.doTKiemTra||[]).length + ' đợt</span></span>';
      h += '</summary><div class="body">';
      var rounds = subj.doTKiemTra || [];
      if (!rounds.length) {
        h += '<p class="hint">Chưa có đợt kiểm tra nào.</p>';
      } else {
        h += '<div class="table-wrap"><table><thead><tr>';
        h += '<th>Đợt kiểm tra</th><th class="num">Điểm</th>';
        h += '</tr></thead><tbody>';
        rounds.forEach(function(r){
          h += '<tr><td>' + esc(r.ten) + '</td>';
          h += '<td class="num"><span class="score-pill ' + scoreClass(r.diem) + '">' + esc(r.diem) + '</span></td></tr>';
        });
        h += '</tbody></table></div>';
        var notes = [];
        rounds.forEach(function(r){
          if (r.nhanXet && notes.indexOf(r.nhanXet) === -1) notes.push(r.nhanXet);
        });
        if (notes.length) {
          h += '<p class="note-highlight"><b>Nhận xét:</b> <b>' + esc(notes.join(' · ')) + '</b></p>';
        }
      }
      h += '</div></details>';
    });

  if (s.ghiChu) h += '<p class="hint">Ghi chú: ' + esc(s.ghiChu) + '</p>';
  h += '</div>';
  return h;
}

function resizeImageToDataUrl(file, maxDim, cb){
  var reader = new FileReader();
  reader.onload = function(){
    var img = new Image();
    img.onload = function(){
      var w = img.width, h = img.height;
      var scale = Math.min(1, maxDim / Math.max(w, h));
      var cw = Math.max(1, Math.round(w * scale));
      var ch = Math.max(1, Math.round(h * scale));
      var canvas = document.createElement('canvas');
      canvas.width = cw; canvas.height = ch;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, cw, ch);
      var out;
      try { out = canvas.toDataURL('image/jpeg', 0.82); }
      catch (e) { out = null; }
      cb(out);
    };
    img.onerror = function(){ cb(null); };
    img.src = reader.result;
  };
  reader.onerror = function(){ cb(null); };
  reader.readAsDataURL(file);
}

function parseRowsFromGrid(grid, sheetSubject){
  if (!grid.length) return [];
  var header = grid[0].map(function(h){ return String(h==null?'':h).trim().toLowerCase(); });
  function col(names){
    for (var n of names) { var idx = header.indexOf(n); if (idx>=0) return idx; }
    return -1;
  }
  var iName = col(['họ tên','ho ten','họ và tên','hoten','name']);
  var iPhone = col(['sđt','sdt','số điện thoại','so dien thoai','phone']);
  var iClass = col(['lớp','lop','class']);
  var iSubject = col(['môn học','mon hoc','môn','subject']);
  var iDateShared = col(['ngày','ngay','ngày kiểm tra','date']);
  var iNoteShared = col(['nhận xét','nhan xet','ghi chú','note']);
  // old-style single round columns (no number suffix)
  var iDot = col(['đợt','dot','đợt kiểm tra','dot kiem tra','round']);
  var iScore = col(['điểm','diem','score']);

  // numbered round-column groups: "Đợt 1"/"Điểm 1"/"Ngày 1"/"Nhận xét 1", "Đợt 2"/..., etc.
  var reDot = /^(đợt|dot)\s*(\d+)$/;
  var reDiem = /^(điểm|diem)\s*(\d+)$/;
  var reNgay = /^(ngày|ngay)\s*(\d+)$/;
  var reNote = /^(nhận xét|nhan xet)\s*(\d+)$/;
  var roundCols = {};
  header.forEach(function(h, idx){
    var m;
    if (m = h.match(reDot)) { roundCols[m[2]] = roundCols[m[2]] || {}; roundCols[m[2]].dot = idx; }
    else if (m = h.match(reDiem)) { roundCols[m[2]] = roundCols[m[2]] || {}; roundCols[m[2]].diem = idx; }
    else if (m = h.match(reNgay)) { roundCols[m[2]] = roundCols[m[2]] || {}; roundCols[m[2]].ngay = idx; }
    else if (m = h.match(reNote)) { roundCols[m[2]] = roundCols[m[2]] || {}; roundCols[m[2]].note = idx; }
  });
  var roundNums = Object.keys(roundCols).sort(function(a,b){ return Number(a)-Number(b); });

  var rows = [];
  for (var r=1;r<grid.length;r++){
    var cells = (grid[r]||[]).map(function(c){ return String(c==null?'':c).trim(); });
    if (!cells.length) continue;
    var hoTen = iName>=0 ? (cells[iName]||'') : '';
    var sdt = iPhone>=0 ? (cells[iPhone]||'') : '';
    var lop = iClass>=0 ? (cells[iClass]||'') : '';
    if (!hoTen && !sdt) continue;
    var monHocBase = iSubject>=0 ? (cells[iSubject]||'') : (sheetSubject||'');
    if (roundNums.length) {
      roundNums.forEach(function(n){
        var rc = roundCols[n];
        var diemVal = rc.diem!=null ? (cells[rc.diem]||'') : '';
        if (!diemVal) return;
        rows.push({
          hoTen: hoTen, sdt: sdt, lop: lop,
          monHoc: monHocBase,
          dot: (rc.dot!=null ? cells[rc.dot] : '') || ('Đợt ' + n),
          diem: diemVal,
          ngay: (rc.ngay!=null ? cells[rc.ngay] : '') || (iDateShared>=0 ? (cells[iDateShared]||'') : ''),
          nhanXet: (rc.note!=null ? cells[rc.note] : '') || (iNoteShared>=0 ? (cells[iNoteShared]||'') : '')
        });
      });
    } else {
      rows.push({
        hoTen: hoTen, sdt: sdt, lop: lop,
        monHoc: monHocBase,
        dot: iDot>=0 ? (cells[iDot]||'') : '',
        diem: iScore>=0 ? (cells[iScore]||'') : '',
        ngay: iDateShared>=0 ? (cells[iDateShared]||'') : '',
        nhanXet: iNoteShared>=0 ? (cells[iNoteShared]||'') : ''
      });
    }
  }
  return rows;
}

function splitCsvLine(l){
  var out = [], cur = '', inQ = false;
  for (var i=0;i<l.length;i++){
    var c = l[i];
    if (inQ){
      if (c === '"' && l[i+1] === '"'){ cur+='"'; i++; }
      else if (c === '"'){ inQ = false; }
      else cur += c;
    } else {
      if (c === '"') inQ = true;
      else if (c === ',' || c === ';') { out.push(cur); cur=''; }
      else cur += c;
    }
  }
  out.push(cur);
  return out.map(function(x){ return x.trim(); });
}

function parseCsv(text){
  var lines = text.split(/\r\n|\n|\r/).filter(function(l){ return l.trim().length; });
  if (!lines.length) return [];
  var grid = lines.map(splitCsvLine);
  return parseRowsFromGrid(grid);
}

function parseXlsx(arrayBuffer){
  if (typeof XLSX === 'undefined') throw new Error('xlsx-lib-missing');
  var wb = XLSX.read(arrayBuffer, { type: 'array' });
  var allRows = [];
  wb.SheetNames.forEach(function(sheetName){
    if (/^hư?ớng dẫn$|^huong dan$/i.test(sheetName.trim())) return;
    var sheet = wb.Sheets[sheetName];
    var grid = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: '' });
    if (!grid.length) return;
    allRows = allRows.concat(parseRowsFromGrid(grid, sheetName.trim()));
  });
  return allRows;
}

function mergeCsvRows(rows){
  var uniqueNewClasses = [];
  rows.forEach(function(row){
    if (row.lop && isNewClaimableClass(row.lop) && uniqueNewClasses.indexOf(row.lop) === -1) uniqueNewClasses.push(row.lop);
  });
  return Promise.all(uniqueNewClasses.map(function(c){
    return claimClass(c).then(function(ok){ return { c: c, ok: ok }; });
  })).then(function(results){
    var failedClasses = results.filter(function(r){ return !r.ok; }).map(function(r){ return r.c; });
    var byPhone = {};
    state.data.students.forEach(function(s){ byPhone[normPhone(s.sdt)] = s; });
    var added = 0, updated = 0, roundCount = 0, skipped = 0;
    rows.forEach(function(row){
      if (!row.hoTen && !row.sdt) return;
      if (!canEditClass(row.lop) || failedClasses.indexOf(row.lop) !== -1) { skipped++; return; }
      var key = normPhone(row.sdt);
      var s = byPhone[key];
      if (!s) {
        s = { id: uid('hs'), hoTen: row.hoTen, sdt: row.sdt, lop: row.lop, ghiChu: '', monHoc: [] };
        byPhone[key] = s;
        state.data.students.push(s);
        added++;
      } else {
        if (row.lop) s.lop = row.lop;
        updated++;
      }
      if (row.monHoc) {
        var subj = s.monHoc.find(function(m){ return m.ten.toLowerCase() === row.monHoc.toLowerCase(); });
        if (!subj) { subj = { ten: row.monHoc, doTKiemTra: [] }; s.monHoc.push(subj); }
        if (row.diem) {
          var roundName = row.dot || ('Kiểm tra ' + (subj.doTKiemTra.length+1));
          subj.doTKiemTra.push({ ten: roundName, diem: row.diem, ngay: row.ngay, nhanXet: row.nhanXet });
          roundCount++;
        }
      }
    });
    delete state.data._isSample;
    return { added: added, updated: updated, roundCount: roundCount, skipped: skipped };
  });
}

function doSearch(){
  var raw = document.getElementById('phone-input').value;
  state.searchPhone = raw;
  var norm = normPhone(raw);
  state.selectedResult = null;
  if (!norm) { state.searchResults = []; state.searchDone = true; render(); return; }
  var matches = state.data.students.filter(function(s){ return normPhone(s.sdt) === norm; });
  state.searchResults = matches;
  state.searchDone = true;
  render();
}

function chunkArray(arr, size){
  var out = [];
  for (var i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
  return out;
}

function doPublish(){
  state.publishStatus = { text: 'Đang lưu…' };
  render();
  var db = firebase.firestore();
  (state.isSuper ? backfillClassOwners(firebase.auth().currentUser.uid, firebase.auth().currentUser.email) : Promise.resolve())
    .then(function(){ doPublishInner(db); });
}

function doPublishInner(db){
  var ops = [];
  var studentsToWrite = state.isSuper ? state.data.students : scopedStudents();
  studentsToWrite.forEach(function(s){
    if (state.isSuper || canEditClass(s.lop)) ops.push({ ref: db.collection('students').doc(s.id), data: s });
  });
  if (state.isSuper) {
    (state.data.teachers || []).forEach(function(t){
      ops.push({ ref: db.collection('teachers').doc(t.id), data: t });
    });
  }
  (state._deletedStudentIds || []).forEach(function(id){
    ops.push({ ref: db.collection('students').doc(id), del: true });
  });
  if (state.isSuper) {
    (state._deletedTeacherIds || []).forEach(function(id){
      ops.push({ ref: db.collection('teachers').doc(id), del: true });
    });
  }
  var nowStr = new Date().toLocaleDateString('vi-VN');
  var settingsData = Object.assign({}, state.data.settings || {}, { classes: state.data.classes || [], updatedAt: nowStr });

  var chunks = chunkArray(ops, 400);
  var p = Promise.resolve();
  chunks.forEach(function(group){
    p = p.then(function(){
      var batch = db.batch();
      group.forEach(function(op){
        if (op.del) batch.delete(op.ref);
        else batch.set(op.ref, op.data);
      });
      return batch.commit();
    });
  });
  if (state.isSuper) {
    p = p.then(function(){ return db.collection('settings').doc('main').set(settingsData, { merge: true }); });
  }

  p.then(function(){
    state.data.updatedAt = nowStr;
    state._deletedStudentIds = [];
    state._deletedTeacherIds = [];
    state.publishStatus = { text: 'Đã lưu. Mọi người sẽ thấy dữ liệu mới khi tải lại trang.', ok: true };
    render();
  }).catch(function(e){
    state.publishStatus = { text: 'Không thể lưu: ' + (e && e.message ? e.message : 'lỗi không xác định'), err: true };
    render();
  });
}

    reader.onload = function(){

        rows = isExcel ? parseXlsx(reader.result) : parseCsv(String(reader.result));
      } catch (err) {
        var msg = isExcel ? 'Không đọc được tệp Excel. Vui lòng kiểm tra định dạng hoặc thử lưu lại thành .xlsx.' : 'Không đọc được tệp CSV. Vui lòng kiểm tra định dạng.';

function backfillClassOwners(uid, email){
  var db = firebase.firestore();
  var classes = getClassList();
  if (!classes.length) return Promise.resolve();
  return Promise.all(classes.map(function(c){
    var ref = db.collection('classOwners').doc(c);
    return ref.get().then(function(doc){
      if (doc.exists) return;
      return ref.set({ ownerUid: uid, email: email, createdAt: new Date().toISOString() }).catch(function(){});
    });
  }));
}

function loadMyAccess(user){
  state.isSuper = (user.email === SUPER_ADMIN_EMAIL);
  var db = firebase.firestore();
  db.collection('adminRoles').doc(user.uid).set({ email: user.email }, { merge: true }).catch(function(){});
  if (state.isSuper) {
    backfillClassOwners(user.uid, user.email).then(function(){
      return db.collection('classOwners').get();
    }).then(function(snap){
      var byUid = {};
      snap.forEach(function(d){
        var v = d.data();
        if (!v.ownerUid) return;
        if (!byUid[v.ownerUid]) byUid[v.ownerUid] = { uid: v.ownerUid, email: v.email || '(không rõ email)', classes: [] };
        byUid[v.ownerUid].classes.push(d.id);
      });
      if (!byUid[user.uid]) byUid[user.uid] = { uid: user.uid, email: user.email, classes: [] };
      state.adminRolesList = Object.keys(byUid).map(function(k){ return byUid[k]; }).sort(function(a,b){
        if (a.email === SUPER_ADMIN_EMAIL) return -1;
        if (b.email === SUPER_ADMIN_EMAIL) return 1;
        return a.email.localeCompare(b.email);
      });
      render();
    }).catch(function(){ render(); });
  } else {
    db.collection('classOwners').where('ownerUid', '==', user.uid).get().then(function(snap){
      var list = [];
      snap.forEach(function(d){ list.push(d.id); });
      state.myClasses = list;
      render();
    }).catch(function(){ render(); });
  }
}

function boot(){
  render();
  firebase.auth().onAuthStateChanged(function(user){
    state.canEdit = !!user;
    state.showLogin = false;
    if (user) {
      loadMyAccess(user);
    } else {
      state.isSuper = false;
      state.myClasses = [];
      state.adminRolesList = [];
    }
    render();
  });
}

boot();
