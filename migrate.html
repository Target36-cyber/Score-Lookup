document.getElementById('btn-login').addEventListener('click', function(){
  var email = document.getElementById('email').value.trim();
  var pass = document.getElementById('pass').value;
  firebase.auth().signInWithEmailAndPassword(email, pass).catch(function(e){
    log('Loi dang nhap: ' + e.message);
  });
});

function chunkArray(arr, size){
  var out = [];
  for (var i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
  return out;
}

document.getElementById('btn-import').addEventListener('click', function(){
  document.getElementById('btn-import').disabled = true;
  var db = firebase.firestore();
  var ops = [];
  (MIGRATE_DATA.students || []).forEach(function(s){
    ops.push({ ref: db.collection('students').doc(s.id), data: s });
  });
  (MIGRATE_DATA.teachers || []).forEach(function(t){
    ops.push({ ref: db.collection('teachers').doc(t.id), data: t });
  });
  log('Chuan bi nhap ' + (MIGRATE_DATA.students||[]).length + ' hoc sinh va ' + (MIGRATE_DATA.teachers||[]).length + ' giao vien...');

  var settingsData = Object.assign({}, MIGRATE_DATA.settings || {}, {
    classes: MIGRATE_DATA.classes || [],
    updatedAt: MIGRATE_DATA.updatedAt || new Date().toLocaleDateString('vi-VN')
  });

  var chunks = chunkArray(ops, 400);
  var p = Promise.resolve();
  chunks.forEach(function(group, idx){
    p = p.then(function(){
      log('Dang ghi nhom ' + (idx+1) + '/' + chunks.length + ' (' + group.length + ' ban ghi)...');
      var batch = db.batch();
      group.forEach(function(op){ batch.set(op.ref, op.data); });
      return batch.commit();
    });
  });
  p = p.then(function(){
    log('Dang ghi settings...');
    return db.collection('settings').doc('main').set(settingsData, { merge: true });
  });
  p.then(function(){
    log('XONG! Da nhap toan bo du lieu vao Firestore.');
    log('Ban co the mo index.html de kiem tra, roi xoa file migrate.html nay khoi repo.');
  }).catch(function(e){
    log('LOI: ' + e.message);
    document.getElementById('btn-import').disabled = false;
  });
});
</script>
</body></html>
